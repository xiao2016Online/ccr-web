# 优云智算 (UCloud Modelverse)
# 优刻得旗下大模型聚合平台, 提供 Anthropic 兼容端点
# 文档: https://www.compshare.cn (modelverse 子产品)
# https://www.compshare.cn/docs/modelverse/models/quick-start

id: ucloud
display_name:
  zh: "优云智算 UCloud"
  zh-Hant: "優雲智算 UCloud"
  en: "UCloud Compshare"
  ja: "UCloud Compshare"
icon: ""
category: aggregator
description:
  zh: "优云智算 Modelverse · Anthropic 兼容端点 (Coding Plan 订阅 + 按量付费 API)"
  zh-Hant: "優雲智算 Modelverse · Anthropic 相容端點 (Coding Plan 訂閱 + 按量計費 API)"
  en: "UCloud Compshare Modelverse · Anthropic-compatible endpoint (Coding Plan subscription + pay-as-you-go API)"
  ja: "UCloud Compshare Modelverse · Anthropic 互換エンドポイント（Coding Plan サブスクリプション + 従量課金 API）"
homepage: "https://www.compshare.cn"
docs_url: "https://www.compshare.cn/docs/modelverse/models/quick-start"
api_key_url: "https://www.compshare.cn/modelverse/console/api-keys"

compatibility: untested

endpoints:
  - id: coding_plan
    label:
      zh: "国内版 · Coding Plan 订阅"
      zh-Hant: "中國版 · Coding Plan 訂閱"
      en: "China · Coding Plan subscription"
      ja: "中国版 · Coding Plan サブスクリプション"
    description:
      zh: "优云智算 Coding Plan 订阅, 适配 Claude Code"
      zh-Hant: "優雲智算 Coding Plan 訂閱, 適配 Claude Code"
      en: "UCloud Compshare Coding Plan subscription, built for Claude Code"
      ja: "UCloud Compshare Coding Plan サブスクリプション。Claude Code 対応"
    base_url: "https://cp.compshare.cn"
    messages_path: "/v1/messages"
    region: china
    billing: subscription

  - id: paygo_cn
    label:
      zh: "国内版 · 按量付费 API"
      zh-Hant: "中國版 · 按量計費 API"
      en: "China · Pay-as-you-go API"
      ja: "中国版 · 従量課金 API"
    description:
      zh: "Modelverse 国内 Anthropic 兼容端点, 按 token 计费"
      zh-Hant: "Modelverse 中國 Anthropic 相容端點, 按 token 計費"
      en: "Modelverse China Anthropic-compatible endpoint, billed per token"
      ja: "Modelverse 中国版の Anthropic 互換エンドポイント。トークン従量課金"
    base_url: "https://api.modelverse.cn"
    messages_path: "/v1/messages"
    region: china
    billing: pay_as_you_go

  - id: paygo_global
    label:
      zh: "国际版 · 按量付费 API"
      zh-Hant: "國際版 · 按量計費 API"
      en: "International · Pay-as-you-go API"
      ja: "国際版 · 従量課金 API"
    description:
      zh: "Modelverse 海外 Anthropic 兼容端点, 按 token 计费"
      zh-Hant: "Modelverse 海外 Anthropic 相容端點, 按 token 計費"
      en: "Modelverse international Anthropic-compatible endpoint, billed per token"
      ja: "Modelverse 国際版の Anthropic 互換エンドポイント。トークン従量課金"
    base_url: "https://api.umodelverse.ai"
    messages_path: "/v1/messages"
    region: global
    billing: pay_as_you_go

default_endpoint: coding_plan

auth:
  type: api_key
  header_name: "Authorization"
  # 上游同时接受 Authorization Bearer 与 x-api-key, 错误信息措辞偏 token,
  # 选 bearer 与其他第三方厂商 (DeepSeek / 智谱 / Moonshot / 小米 / 阿里云) 保持一致
  header_format: bearer

required_headers:
  anthropic-version: "2023-06-01"

forward_headers: []

model_discovery:
  enabled: true
  # 三个 endpoint 都暴露同域 /v1/models, 直接走 base_url + path 拼接
  # 国内/海外按量端无需 auth 即可访问 (公开列表), Coding Plan 端需订阅 key
  path: "/v1/models"
  cache_ttl_hours: 24
  example_models:
    - "claude-opus-4-7"
    - "claude-sonnet-4.5-thinking"
    - "claude-haiku-4-5-20251001"
    - "qwen3-coder-plus"
    - "glm-5.1"
    - "kimi-k2.6"
