id: xiaomi
display_name:
  zh: "小米 MiMo"
  zh-Hant: "小米 MiMo"
  en: "Xiaomi MiMo"
  ja: "Xiaomi MiMo"
icon: xiaomi
category: first_party
description:
  zh: "小米 MiMo 开放平台 · 按量付费 + Token Plan 订阅（Anthropic 兼容）"
  zh-Hant: "小米 MiMo 開放平台 · 按量計費 + Token Plan 訂閱（Anthropic 相容）"
  en: "Xiaomi MiMo open platform · pay-as-you-go + Token Plan subscription (Anthropic-compatible)"
  ja: "Xiaomi MiMo オープンプラットフォーム · 従量課金 + Token Plan サブスクリプション（Anthropic 互換）"
homepage: "https://platform.xiaomimimo.com"
docs_url: "https://platform.xiaomimimo.com/docs/api/chat/anthropic-api"
api_key_url: "https://platform.xiaomimimo.com/#/console/api-keys"

compatibility: verified
compatibility_notes: 

endpoints:
  - id: token_plan_cn
    label:
      zh: "国内版 · Token Plan · 中国集群"
      zh-Hant: "中國版 · Token Plan · 中國叢集"
      en: "China · Token Plan · China cluster"
      ja: "中国版 · Token Plan · 中国クラスタ"
    description:
      zh: "订阅制, 中国大陆低延迟"
      zh-Hant: "訂閱制, 中國大陸低延遲"
      en: "Subscription-based, low latency in mainland China"
      ja: "サブスクリプション制。中国本土で低遅延"
    base_url: "https://token-plan-cn.xiaomimimo.com/anthropic"
    messages_path: "/v1/messages"
    region: china
    billing: subscription

  - id: paygo
    label:
      zh: "按量付费 API"
      zh-Hant: "按量計費 API"
      en: "Pay-as-you-go API"
      ja: "従量課金 API"
    description:
      zh: "按 token 计费, 最通用的端点"
      zh-Hant: "按 token 計費, 最通用的端點"
      en: "Billed per token; the most general-purpose endpoint"
      ja: "トークン従量課金。最も汎用的なエンドポイント"
    base_url: "https://api.xiaomimimo.com/anthropic"
    messages_path: "/v1/messages"
    region: global
    billing: pay_as_you_go

  - id: token_plan_sgp
    label:
      zh: "国际版 · Token Plan · 新加坡集群"
      zh-Hant: "國際版 · Token Plan · 新加坡叢集"
      en: "International · Token Plan · Singapore cluster"
      ja: "国際版 · Token Plan · シンガポールクラスタ"
    description:
      zh: "订阅制, 亚太用户推荐"
      zh-Hant: "訂閱制, 亞太使用者推薦"
      en: "Subscription-based, recommended for Asia-Pacific users"
      ja: "サブスクリプション制。アジア太平洋のユーザーにおすすめ"
    base_url: "https://token-plan-sgp.xiaomimimo.com/anthropic"
    messages_path: "/v1/messages"
    region: global
    billing: subscription

  - id: token_plan_ams
    label:
      zh: "欧洲 · Token Plan · 欧洲集群"
      zh-Hant: "歐洲 · Token Plan · 歐洲叢集"
      en: "Europe · Token Plan · Europe cluster"
      ja: "ヨーロッパ · Token Plan · ヨーロッパクラスタ"
    description:
      zh: "订阅制, 欧洲用户推荐"
      zh-Hant: "訂閱制, 歐洲使用者推薦"
      en: "Subscription-based, recommended for users in Europe"
      ja: "サブスクリプション制。ヨーロッパのユーザーにおすすめ"
    base_url: "https://token-plan-ams.xiaomimimo.com/anthropic"
    messages_path: "/v1/messages"
    region: eu
    billing: subscription

default_endpoint: token_plan_cn

auth:
  type: api_key
  header_name: "Authorization"
  header_format: bearer

required_headers:
  anthropic-version: "2023-06-01"

forward_headers: []

model_discovery:
  enabled: true
  # Anthropic 兼容端点的 /anthropic/models 未在文档中列出,
  # 使用官方 OpenAI 兼容端点作为 discovery URL (/v1/models 是 OpenAI 标准)。
  # 若订阅 key 对该 URL 返回 401/403, 前端自动 fallback 到手动输入。
  url: "https://api.xiaomimimo.com/v1/models"
  path: "/v1/models"
  cache_ttl_hours: 24
  example_models:
    - "mimo-v2.5-pro"
    - "mimo-v2.5"
