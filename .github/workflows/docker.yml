# 服务器版 Docker 镜像自动构建: 推送到 server 分支 (或手动触发) 时构建并发布到 GHCR。
#
# 产物: ghcr.io/xiao2016online/ccr-web:latest (及 <commit-sha> 标签)
# 服务器直接:  docker pull ghcr.io/xiao2016online/ccr-web:latest
#
# 当前只构建 linux/amd64 (用户的云服务器是 x86)。以后要加回 ARM 双架构时,
# 恢复成「双 runner 矩阵构建 per-arch digest + imagetools 合并 manifest」的结构即可,
# 历史版本见本文件的 git 记录 (commit 2746cfe 之前的 docker.yml)。
#
# 说明: 上游的 release.yml 只在 v* 标签上触发桌面打包, 与本工作流互不干扰。

name: docker

on:
  push:
    branches: [server]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/xiao2016online/ccr-web

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
