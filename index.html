<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src-tauri/icons/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cc-router</title>
  </head>
  <body>
    <script>
      // 首帧前同步明暗与界面主题, 避免启动时先闪一下别的配色。
      // 键名与 src/hooks/useTheme.tsx 的 MODE_KEY、src/themes/index.ts 保持一致。
      // 服务器版只有科技蓝一套主题 (plain 画风): 只恢复明暗, 主题恒为 techblue。
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem("cc-router-theme");
          var dark =
            t === "dark" ||
            (t !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) root.classList.add("dark");
        } catch (e) {}
        root.setAttribute("data-theme", "techblue");
        root.setAttribute("data-art", "plain");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
